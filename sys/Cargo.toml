[package]
name = "libappindicator-sys"
version = "0.10.0"
description = "Rust sys bindings for libappindicator"
license = "Apache-2.0 OR MIT"
keywords = ["linux", "gui"]
edition = "2018"
categories = ["external-ffi-bindings"]
rust-version = "1.92"

[dependencies]
gtk-sys = "0.19"
libloading = "0.9"

[features]
default = ["backcompat"]
backcompat = []
