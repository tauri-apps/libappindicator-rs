[package]
name = "libappindicator"
version = "0.10.0"
description = "Rust safe bindings for libappindicator"
edition = "2021"
license = "Apache-2.0 OR MIT"
keywords = ["linux", "gui", "gtk"]
rust-version = "1.92"

[dependencies]
gtk = "0.19"
libappindicator-sys = { version = "0.10", path = "sys/" }

[features]
default = ["backcompat"]
backcompat = ["libappindicator-sys/backcompat"]
